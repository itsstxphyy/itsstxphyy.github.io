<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Pocket Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="section hero">
    <div class="section-inner">
      <div class="logo-placeholder">
        <img src="assets/Logo.png" alt="Tiny Pocket Studio" class="logo-image">
      </div>
      <a href="#apps" class="arrow-down" aria-label="Scroll down">↓</a>
    </div>
  </section>

  <section id="apps" class="section">
      <div class="section-inner">
          <h2>Our Apps</h2>

          <article class="app-card">
              <div class="app-image-placeholder">
                  <span>App image</span>
              </div>
              <div class="app-info">
                  <h3>DaySync</h3>
                  <p>Your calendar, without the chaos. DaySync keeps every plan in one clean view.</p>
                  <div class="badges">
                      <a href="#" class="badge" aria-label="Get it on Google Play">▶</a>
                      <a href="#" class="badge" aria-label="Download on the App Store">A</a>
                  </div>
              </div>
          </article>
      </div>
  </section>

  <section class="section">
    <div class="section-inner">
      <h2>About Us</h2>

      <div class="team">
        <div class="team-member">
          <div class="avatar-placeholder">👤</div>
          <div class="team-info">
            <h3>N. P.</h3>
            <p>Coder &amp; builder of the things you tap</p>
          </div>
        </div>

        <div class="team-member">
          <div class="avatar-placeholder">👤</div>
          <div class="team-info">
            <h3>S. N.</h3>
            <p>Artist &amp; keeper of the little details</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section contact">
    <div class="section-inner">
      <h2>Contact Us</h2>
      <div class="social-icons">
        <a href="#" aria-label="Instagram">📷</a>
        <a href="#" aria-label="Email">✉️</a>
        <a href="#" aria-label="TikTok">🎵</a>
      </div>
      <footer>
        <p>&copy; 2026 Tiny Pocket Studio</p>
      </footer>
    </div>
  </section>

</body>
</html>
